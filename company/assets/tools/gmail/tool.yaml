id: gmail
name: Gmail
description: >
  Access Gmail (uzena.nari@gmail.com) via Google API — search and read emails,
  and create DRAFTS (new or reply-in-thread). DRAFTS ONLY: you cannot send email;
  every draft stays in uzena.nari@gmail.com's Drafts folder until ARY reviews and sends it himself.
  After creating a draft, ALWAYS tell ARY with report_to_ceo() that a draft is waiting (recipient + subject).
  員工只能寫草稿、不能寄信；寫好草稿後一定要用 report_to_ceo() 告訴 ARY 有草稿等他審核。
  IMPORTANT: Gmail is ONLY for external communication (clients, vendors, partners).
  NEVER use Gmail for internal task dispatch or employee coordination —
  use dispatch_child() for that. NEVER use Gmail to contact CEO — use report_to_ceo().
added_by: CEO
sprite: desk_equipment
type: langchain_module
# Access: company asset tool (no source_talent) → ToolRegistry gives it to every
# employee; allowed_users is ignored for non-talent asset tools, so it is not set.
# Drafts can't go out, so open access is intentional (docs/ary/email-drafts-only.md).
oauth:
  service_name: gmail
  authorize_url: https://accounts.google.com/o/oauth2/v2/auth
  token_url: https://oauth2.googleapis.com/token
  scopes: https://www.googleapis.com/auth/gmail.readonly https://www.googleapis.com/auth/gmail.compose
  client_id_env: GOOGLE_OAUTH_CLIENT_ID
  client_secret_env: GOOGLE_OAUTH_CLIENT_SECRET
  client_file_env: GOOGLE_OAUTH_CLIENT_FILE
  remote_paste: true
  credentials_help:
    text: "Google Cloud Console（用 uzena.nari@gmail.com 登入）：建專案 → 啟用 Gmail API → OAuth 同意畫面（External）→ 建立 OAuth 用戶端（桌面應用程式）→ 下載 JSON，放到 Harbor 的 secrets/google_oauth_client.json。步驟見 docs/ary/email-drafts-only.md"
    url: https://console.cloud.google.com/apis/credentials
templates:
  dir: templates
  format: md
